<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AgentOS assistant bar</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="bar.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 11a6 6 0 0 0 12 0M12 17v4m-4 0h8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m-6 6 6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor"/></symbol>
</svg>
<!-- The bar: a transcript block that opens while talking/working, and one row: mic · text field · close -->
<div class="bar glass" id="card">
  <div class="tx" id="tx"><div>
    <div class="hd"><span class="orb sm" id="orb"></span><span id="st">Listening</span><button type="button" class="stop" id="stop" hidden aria-label="Stop"><svg width="12" height="12"><use href="#i-stop"/></svg></button></div>
    <p class="u" id="u"></p>
    <p class="a" id="a"></p>
  </div></div>
  <form class="row" id="form" autocomplete="off">
    <button type="button" class="mic" id="mic" aria-label="Microphone"><i class="halo"></i><i class="core"></i><svg width="18" height="18"><use href="#i-mic"/></svg></button>
    <input id="in" placeholder="Ask anything" enterkeyhint="send" autocapitalize="sentences">
    <button type="submit" class="send" id="send" aria-label="Send"><svg width="16" height="16"><use href="#i-send"/></svg></button>
    <button type="button" class="x" id="x" aria-label="Close"><svg width="14" height="14"><use href="#i-x"/></svg></button>
  </form>
</div>
<audio id="spk" autoplay></audio>
<script src="voice-audio.js"></script>
<script src="bar.js"></script>
</body>
</html>
