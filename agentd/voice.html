<!doctype html><meta charset="utf-8"><title>AgentOS voice</title>
<button id="go">Start voice</button> <button id="end">Stop</button> <button id="cam" hidden>Camera</button>
<audio id="spk" autoplay></audio><video id="view" playsinline muted hidden width="240"></video><pre id="out"></pre>
<button id="interrupt">Mute / interrupt</button><script src="/voice-audio.js"></script>
<script>
// Bare voice client for agentd (browser or the island WebView; restyle freely, keep the WebRTC part).
// Open http://127.0.0.1:8787/voice#token=<agentd token>. ?auto starts at once; ?wav=<url> plays a speech file instead of the mic.
// Flow: mic + "oai-events" data channel -> offer -> agentd voice.start -> voice.answer. Audio goes straight to OpenAI.
// Vision (agentd VOICE_VISION=1, research/LIVE-VISION.md): the camera sends agentd one JPEG frame (voice.frame) each time
// the user starts talking, never a stream; agentd's eyes model answers and the voice says it. ?img=<url> stands in for the camera.
const T0 = performance.now(), now = () => Math.round(performance.now() - T0), $ = (id) => document.getElementById(id);
const out = (s) => { console.log(`${now()} ${s}`); $('out').textContent += `${now()} ${s}\n`; };
const q = new URLSearchParams(location.search), token = new URLSearchParams(location.hash.slice(1)).get('token');
const ws = new WebSocket(`ws://${location.host}/`, 'agentos.bearer.' + token);
let pc, mic, audioGate, idle, unmeter, t, cam, lastShot = 0, lastMic = 0, doneAt = 0;
const trace = (event, data = {}) => { if (q.has('bench')) fetch('/log', { method: 'POST', body: JSON.stringify({ at: now(), event, ...data }) + '\n' }); };
trace('page');

ws.onmessage = async (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'task.update') { trace('task.' + m.why, { task: m.task.id, state: m.task.state, timing: m.task.timing }); if (m.why === 'done') doneAt = now(); }
  if (m.type === 'voice.transcript' || m.type === 'voice.error') trace(m.type, { role: m.role, text: m.text || m.message });
  if (m.type === 'voice.answer') { $('cam').hidden = !m.vision; if (q.get('img')) ws.send(JSON.stringify({ type: 'voice.camera', on: true })); await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }); out(`answer applied +${now() - t}ms (agentd ${m.ms}ms)`); }
  else if (m.type !== 'text.delta') out(`${m.type} ${JSON.stringify(m).slice(0, 300)}`);
};

async function start() {
  if (mic?.getAudioTracks()[0]?.readyState === 'live') return;
  clearTimeout(idle); t = now(); lastMic = doneAt = 0; trace('mic_on');
  mic = q.get('wav') ? await fileStream(q.get('wav')) : await navigator.mediaDevices.getUserMedia({ audio: voiceConstraints });
  if (pc?.connectionState === 'connected' && audioGate) { audioGate.track = mic.getAudioTracks()[0]; audioGate.active = true; audioGate.muted = false; audioGate.apply(); }
  else audioGate = new VoiceAudio(mic.getAudioTracks()[0], $('spk'), out);
  if (pc?.connectionState === 'connected') {
    await pc.getSenders()[0].replaceTrack(mic.getAudioTracks()[0]);
    unmeter = meter(mic, $('spk').srcObject); trace('ready', { ms: now() - t, reused: true });
    setTimeout(() => mic.play?.(), 1000); return;
  }
  pc?.close(); pc = new RTCPeerConnection();
  pc.addTrack(mic.getAudioTracks()[0], mic);
  const dc = pc.createDataChannel('oai-events'); // must exist before createOffer
  dc.onopen = () => { out(`datachannel open +${now() - t}ms`); trace('ready', { ms: now() - t }); setTimeout(() => mic.play?.(), 1000); };
  dc.onmessage = (e) => {
    const m = JSON.parse(e.data);
    audioGate?.event(m);
    if (/^(turn\.(created|done)|input_audio_buffer\.|output_audio_buffer\.|response\.|conversation\.item\.truncated|error)/.test(m.type) && !/delta/.test(m.type)) {
      trace(m.type, { role: m.turn?.role, mic: mic.getAudioTracks()[0].enabled });
      ws.send(JSON.stringify({ type: 'voice.audio', event: m.type, role: m.turn?.role, mic: mic.getAudioTracks()[0].enabled }));
    }
    if (m.type === 'delegation.created') // hand it to agentd at once (agentd also hears it via app-server; it dedupes)
      ws.send(JSON.stringify({ type: 'voice.delegate', item_id: m.item.id, handoff_id: m.item.handoff_id, turn_id: m.item.user_bidi_turn_id, text: m.item.content.map((c) => c.text).join('') }));
    if (m.type === 'turn.done' && m.turn?.role === 'user') ws.send(JSON.stringify({ type: 'voice.heard', turn_id: m.turn.id, text: m.turn.transcript }));
    if (m.type === 'turn.done') trace('turn.done', { role: m.turn?.role, text: m.turn?.transcript });
    if (m.type === 'turn.done') out(`dc turn.done ${m.turn?.role}: ${m.turn?.transcript ?? ''}`);
    else if (/error/.test(m.type)) out(`dc ${m.type} ${JSON.stringify(m).slice(0, 1500)}`);
    else if (/^(session.started|delegation)/.test(m.type) || (q.has('wav') && !/delta|audio|usage/.test(m.type))) out(`dc ${m.type} ${JSON.stringify(m).slice(0, 240)}`);
  };
  pc.onconnectionstatechange = () => out(`pc ${pc.connectionState} +${now() - t}ms`);
  pc.ontrack = (e) => { $('spk').srcObject = e.streams[0]; unmeter = meter(mic, e.streams[0]); };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((ok) => { setTimeout(ok, 500); // host candidates are enough (the answer is ice-lite); don't wait for slow interfaces
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && ok(); });
  out(`offer ready +${now() - t}ms`);
  ws.send(JSON.stringify({ type: 'voice.start', client_handoffs: true, sdp: pc.localDescription.sdp }));
}

// Latency: end of mic speech -> first loud sample of the reply.
function meter(micStream, remote) {
  const ac = new AudioContext(), buf = new Float32Array(1024);
  const an = (s) => { const a = ac.createAnalyser(); ac.createMediaStreamSource(s).connect(a); return a; };
  const lvl = (a) => { a.getFloatTimeDomainData(buf); return Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length); };
  const micA = an(micStream), spkA = an(remote);
  let lastSpk = 0, micOn = false, spkOn = false;
  const timer = setInterval(() => {
    const tt = now();
    audioGate?.sample(lvl(spkA));
    if (lvl(micA) > 0.02) { lastMic = tt; if (!micOn) { micOn = true; out('mic speech start'); snap(); } }
    if (micOn && tt - lastMic > 400) { micOn = false; out('mic speech end'); trace('speech_end', { end: lastMic }); }
    if (lvl(spkA) > 0.01) { if (!spkOn) { spkOn = true; trace('audio', { sinceSpeech: tt - lastMic, sinceDone: doneAt ? tt - doneAt : null }); out(`REPLY AUDIO start, ${micOn ? 'while user talking' : tt - lastMic + 'ms after mic end'}`); } lastSpk = tt; }
    if (spkOn && tt - lastSpk > 600) { spkOn = false; out('reply audio end'); }
  }, 20);
  return () => { clearInterval(timer); ac.close(); };
}

async function fileStream(url) { // test mode: a speech file as the "mic"
  const ac = new AudioContext(), dest = ac.createMediaStreamDestination();
  const buf = await ac.decodeAudioData(await (await fetch(url)).arrayBuffer());
  dest.stream.dispose = () => ac.close();
  dest.stream.play = () => { const s = ac.createBufferSource(); s.buffer = buf; s.connect(dest); s.start(); out('playing ' + url); };
  return dest.stream;
}

// One JPEG (long side <= max px) of a video or image element.
function jpeg(src, w, h, max = 768, q = 0.7) {
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
// Camera open (or ?img): the user just started talking, so send what the camera sees now (at most one per 1.5 s).
async function snap() {
  const v = $('view'), img = q.get('img') && await new Promise((ok) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.src = q.get('img'); });
  if ((!cam && !img) || now() - lastShot < 1500) return;
  lastShot = now();
  const image = img ? jpeg(img, img.naturalWidth, img.naturalHeight) : jpeg(v, v.videoWidth, v.videoHeight);
  ws.send(JSON.stringify({ type: 'voice.frame', image })); out(`frame sent ${Math.round(image.length * 0.75 / 1024)} KB`);
}
$('cam').onclick = async () => {
  if (cam) { cam.getTracks().forEach((k) => k.stop()); cam = null; $('view').hidden = true; ws.send(JSON.stringify({ type: 'voice.camera', on: false })); return; }
  cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
  $('view').srcObject = cam; $('view').hidden = false; await $('view').play(); ws.send(JSON.stringify({ type: 'voice.camera', on: true }));
};
$('go').onclick = () => start().catch((e) => out('ERR ' + e));
$('interrupt').onclick = () => audioGate?.toggle();
function drop() { clearTimeout(idle); audioGate = null; ws.send(JSON.stringify({ type: 'voice.stop' })); pc?.close(); pc = null; }
$('end').onclick = () => {
  if (audioGate) { audioGate.active = false; audioGate.apply(); }
  mic?.getTracks().forEach((t) => t.stop()); mic?.dispose?.(); unmeter?.(); $('spk').muted = true;
  clearTimeout(idle);
  if (pc?.connectionState === 'connected') { pc.getSenders()[0].replaceTrack(null).catch(() => {}); idle = setTimeout(drop, 60000); }
  else drop();
  trace('paused', { microphone: mic?.getAudioTracks()[0]?.readyState }); out('stopped');
};
if (q.has('auto')) ws.onopen = $('go').onclick;
</script>
